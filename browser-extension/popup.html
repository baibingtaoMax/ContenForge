<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 300px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; color: #1a1d29; background: #fff; }
  .head { padding: 14px 16px 10px; border-bottom: 1px solid #eee; }
  .head h1 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .head .dot { width: 8px; height: 8px; border-radius: 50%; background: #f97316; }
  .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 12px; color: #6a6f7c; display: block; margin-bottom: 4px; }
  input, select { width: 100%; height: 32px; border: 1px solid #dcdfe7; border-radius: 7px; padding: 0 9px; font-size: 13px; outline: none; background: #fff; }
  input:focus, select:focus { border-color: #f97316; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  .status { font-size: 12px; color: #8a8f9c; display: flex; align-items: center; gap: 6px; }
  .status .n { color: #f97316; font-weight: 700; }
  .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #dcdfe7; border-radius: 12px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input:checked + .slider { background: #f97316; }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #fafbfc; border: 1px solid #eef0f4; border-radius: 9px; }
  .switch-row .t { font-size: 13px; font-weight: 600; }
  .switch-row .s { font-size: 11px; color: #8a8f9c; margin-top: 2px; }
  .err { color: #e5484d; font-size: 12px; display: none; background: #fef0f0; padding: 8px 10px; border-radius: 7px; }
  .foot { padding: 8px 16px 12px; font-size: 11px; color: #b0b4bf; }
</style>
</head>
<body>
  <div class="head"><h1><span class="dot"></span>ProtoForge 站外标注</h1></div>
  <div class="body">
    <div>
      <label>PF 服务地址</label>
      <input id="pfBase" value="http://localhost:3100" placeholder="http://localhost:3100">
    </div>
    <div>
      <label>归属项目</label>
      <select id="project"><option value="">加载中…</option></select>
    </div>
    <div class="err" id="err"></div>
    <div class="switch-row">
      <div>
        <div class="t">标注模式</div>
        <div class="s" id="switchSub">开启后点击页面元素贴意见</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="status" id="status">当前页意见：<span class="n" id="count">–</span></div>
    <button id="collect" style="height:34px;border-radius:8px;border:1px solid #f97316;background:#fff7f2;color:#ea6c10;font-size:13px;font-weight:600;cursor:pointer">📥 采集本页到 PF</button>
    <div class="status" id="collectMsg" style="display:none"></div>
  </div>
  <div class="foot">意见按页面 URL 回传，仅本地自用</div>
  <script src="popup.js"></script>
</body>
</html>
